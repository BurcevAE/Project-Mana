<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MANA</title>
<style>
  :root {
    --ground: #0f1117;
    --panel: #171a22;
    --panel-2: #1e2230;
    --line: #262b38;
    --ink: #e7e9f0;
    --ink-soft: #9aa2b4;
    --ink-faint: #6d768a;
    --accent: #8f7cf7;
    --ok: #63c193;
    --warn: #d8a94b;
    --crit: #e57b6b;
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --ground: #f5f6f9; --panel: #ffffff; --panel-2: #eef0f5; --line: #dfe2ea;
      --ink: #151824; --ink-soft: #5b6273; --ink-faint: #8b93a5; --accent: #5b46d6;
      --ok: #2c6d4f; --warn: #8a6212; --crit: #b23c2b;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    display: grid; grid-template-columns: 1fr 21rem; height: 100vh; overflow: hidden;
    /* An implicit grid row is sized by its CONTENT, so a long chat made the
       row taller than the viewport however small the body was told to be.
       minmax(0, 1fr) is what forbids that. Without it the whole layout
       silently stops being a window and becomes a very long page. */
    grid-template-rows: minmax(0, 1fr);
  }

  /* ---------- chat ---------- */
  /* min-height: 0 on every item in the chain. A grid or flex item defaults
     to min-height: auto -- "never shrink below my content" -- so `flex: 1`
     plus `overflow-y: auto` on .log below never took effect: the column
     grew instead of scrolling, the first messages went above the top of
     the window and the composer was pushed below the bottom. Measured on
     a real run: .log reached 39 622px inside a 900px window. */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-head {
    display: flex; align-items: center; gap: .75rem;
    padding: .8rem 1.25rem; border-bottom: 1px solid var(--line); flex: none;
  }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .dot.ready { background: var(--ok); }
  .dot.busy { background: var(--warn); animation: pulse 1.1s ease-in-out infinite; }
  .dot.error { background: var(--crit); }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .chat-head h1 { font-size: .95rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
  .chat-head .sub { font-family: var(--mono); font-size: .75rem; color: var(--ink-faint); margin-left: auto; }

  .log { flex: 1; min-height: 0; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
  .msg { max-width: 46rem; }
  .msg.user { align-self: flex-end; }
  .bubble {
    padding: .7rem .95rem; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word;
    background: var(--panel); border: 1px solid var(--line);
  }
  .msg.user .bubble { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg.error .bubble { border-color: var(--crit); color: var(--crit); }

  .cycle-controls {
    display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
    padding-bottom: .7rem; margin-bottom: .7rem; border-bottom: 1px solid var(--line);
  }
  .cycle-controls label { font-size: .78rem; color: var(--ink-faint); display: flex;
                          align-items: center; gap: .3rem; }
  .cycle-controls input { width: 4.5rem; background: var(--panel-2); color: var(--ink);
                          border: 1px solid var(--line); border-radius: 5px;
                          padding: .25rem .4rem; font-family: var(--mono); font-size: .78rem; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .7rem;
        font-family: var(--mono); font-size: .74rem; margin-bottom: .8rem; }
  .kv b { color: var(--ink-faint); font-weight: 500; }
  .slice { display: grid; grid-template-columns: 9rem 3rem 1fr;
           gap: .4rem; align-items: center; font-family: var(--mono);
           font-size: .72rem; padding: .15rem 0; }
  .bar { height: .5rem; background: var(--panel-2); border-radius: 3px; position: relative; }
  .bar > i { position: absolute; top: 0; bottom: 0; background: var(--ok);
             border-radius: 3px; display: block; }
  .bar > u { position: absolute; top: -2px; bottom: -2px; width: 1px;
             background: var(--ink-faint); }
  .prov {
    display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem;
    font-family: var(--mono); font-size: .7rem;
  }
  .tag {
    padding: .12rem .4rem; border-radius: 3px; background: var(--panel-2);
    color: var(--ink-soft); border: 1px solid var(--line);
  }
  .tag.good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .tag.bad  { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); }

  .composer {
    flex: none; border-top: 1px solid var(--line); padding: .85rem 1.25rem;
    display: flex; gap: .6rem; align-items: flex-end; background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; min-height: 2.6rem; max-height: 9rem;
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: .6rem .75rem; font: inherit;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 500; padding: .6rem 1rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }

  /* ---------- side ---------- */
  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  .tabs button {
    flex: 1; border: none; border-radius: 0; background: none; color: var(--ink-faint);
    padding: .65rem .3rem; font-size: .8rem; border-bottom: 2px solid transparent;
  }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { display: none; overflow-y: auto; padding: .9rem 1rem; flex: 1; min-height: 0; }
  .pane.on { display: block; }

  .brain { padding: .5rem 0; border-bottom: 1px solid var(--line); }
  .brain:last-child { border-bottom: none; }
  .brain-top { display: flex; align-items: baseline; gap: .5rem; }
  .brain-id { font-family: var(--mono); font-size: .8rem; }
  .brain .state { margin-left: auto; font-family: var(--mono); font-size: .68rem; }
  .brain.ready .state { color: var(--ok); }
  .brain:not(.ready) .state { color: var(--ink-faint); }
  .brain-model { font-family: var(--mono); font-size: .68rem; color: var(--ink-faint); }
  .brain-note { font-size: .72rem; color: var(--ink-faint); margin-top: .15rem; }

  .keyrow { display: flex; gap: .35rem; margin-top: .35rem; }
  .keyrow input {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); border-radius: 5px; padding: .25rem .4rem;
    font-family: var(--mono); font-size: .72rem;
  }
  .keyrow button { padding: .25rem .5rem; font-size: .72rem; }

  #logstream {
    font-family: var(--mono); font-size: .72rem; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; color: var(--ink-soft); margin: 0;
  }
  #logstream .warning { color: var(--warn); }
  #logstream .error { color: var(--crit); }

  dl.kv { margin: 0; font-size: .78rem; }
  dl.kv dt { font-family: var(--mono); font-size: .68rem; color: var(--ink-faint); margin-top: .55rem; }
  dl.kv dd { margin: 0; font-family: var(--mono); font-size: .72rem; word-break: break-all; }
  dl.kv dd.yes { color: var(--ok); }
  dl.kv dd.no { color: var(--crit); }
  .hint { color: var(--ink-faint); font-size: .75rem; }
</style>
</head>
<body>

<main class="chat">
  <header class="chat-head">
    <span class="dot" id="dot"></span>
    <h1 id="state">Запуск...</h1>
    <span class="sub" id="brainsline"></span>
  </header>

  <div class="log" id="log">
    <div class="msg">
      <div class="bubble">Готова к работе. Под каждым ответом будет видно, какой мозг отвечал, проверялся ли ответ и сошлись ли мозги между собой.</div>
    </div>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Спросите что-нибудь…  (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button type="submit" class="primary" id="send">Спросить</button>
    <button type="button" id="cancel" disabled>Стоп</button>
  </form>
</main>

<aside>
  <nav class="tabs">
    <button class="on" data-pane="brains">Мозги</button>
    <button data-pane="cycle">Цикл</button>
    <button data-pane="genome">Геном</button>
    <button data-pane="log">Журнал</button>
    <button data-pane="system">Система</button>
  </nav>

  <section class="pane on" id="pane-brains"><div id="brains" class="hint">Загрузка…</div></section>
  <section class="pane" id="pane-cycle">
    <div class="cycle-controls">
      <label>бюджет <input id="cycle-budget" type="number" value="200" min="12" step="12"></label>
      <label>шагов <input id="cycle-steps" type="number" value="6" min="1" max="30"></label>
      <button id="cycle-start">Запустить</button>
      <button id="cycle-stop" disabled>Остановить</button>
    </div>
    <div id="cycle-note" class="hint">Цикл сам решает, что мерить и что проверять.
      Шаги идут в Журнал.</div>
    <div id="cycle-out"></div>
  </section>
  <section class="pane" id="pane-genome">
    <div id="genome-out" class="hint">Загрузка…</div>
  </section>
  <section class="pane" id="pane-log"><pre id="logstream"></pre></section>
  <section class="pane" id="pane-system">
    <dl class="kv" id="paths"></dl>
    <p class="hint" id="evo"></p>
  </section>
</aside>

<script>
const $ = (id) => document.getElementById(id);
const api = (path, body) => fetch(path, body
  ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
  : undefined).then(r => r.json());

/* ---------- chat ---------- */

function bubble(text, cls) {
  const wrap = document.createElement("div");
  wrap.className = "msg" + (cls ? " " + cls : "");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  wrap.appendChild(b);
  $("log").appendChild(wrap);
  $("log").scrollTop = $("log").scrollHeight;
  return wrap;
}

function tag(parent, text, cls) {
  const el = document.createElement("span");
  el.className = "tag" + (cls ? " " + cls : "");
  el.textContent = text;
  parent.appendChild(el);
}

/* The provenance row is the point of the window: the same facts the CLI
   dumped as JSON nobody read. Only what is true for this answer is shown --
   an empty row means a plain single-brain reply with no verification. */
function provenance(wrap, p) {
  const row = document.createElement("div");
  row.className = "prov";
  if (p.brain) tag(row, "мозг: " + p.brain);
  if (p.attempts && p.attempts.length > 1) tag(row, "попытки: " + p.attempts.join(" → "), "warn");
  if (p.strategy && p.strategy !== "single") tag(row, p.strategy, "good");
  if (p.subtasks) tag(row, p.subtasks + " подзадач: " + (p.brains_used || []).join(", "), "good");
  if (typeof p.agreement === "number") {
    tag(row, "согласие " + p.agreement.toFixed(2), p.disagreement ? "bad" : "good");
  }
  if (p.verified) tag(row, "проверено: " + p.verification, "good");
  if (p.critic_brain) {
    tag(row, "критик: " + p.critic_brain + (p.critic_independent ? " (независимый)" : " (тот же мозг)"),
        p.critic_independent ? "good" : "warn");
  }
  if (p.fallback) tag(row, "без LLM, шаблонный ответ", "warn");
  if (row.children.length) wrap.appendChild(row);
}

/* What THIS answer cost, in units that mean something. A call count made
   a 120B remote model and a local 7B the same number; an answer that came
   from an algorithmic brain costs no tokens at all, and that is the fact
   worth seeing under every reply. */
function costRow(wrap, c) {
  if (!c || !c.calls) return;
  const row = document.createElement("div");
  row.className = "prov";
  const mix = Object.entries(c.by_substrate || {})
    .map(([k, v]) => k + "×" + v).join(", ");
  tag(row, c.calls + " вызовов");
  tag(row, (c.wall_seconds || 0).toFixed(2) + " с");
  if (c.tokens_in + c.tokens_out > 0) {
    tag(row, (c.tokens_in + c.tokens_out) + " токенов",
        c.unmeasured_token_calls ? "warn" : "");
  } else if (c.unmeasured_token_calls) {
    tag(row, "токены не измерены", "warn");
  } else {
    tag(row, "0 токенов", "good");
  }
  if (mix) tag(row, mix);
  wrap.appendChild(row);
}

let busy = false;
function setBusy(v) {
  busy = v;
  $("send").disabled = v;
  $("cancel").disabled = !v;
  $("dot").className = "dot " + (v ? "busy" : "ready");
  $("state").textContent = v ? "Думаю…" : "Готова";
}

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return;
  bubble(text, "user");
  $("input").value = "";
  $("input").style.height = "auto";
  setBusy(true);
  let res;
  try {
    res = await api("/api/ask", { text });
  } catch (err) {
    res = { ok: false, error: String(err) };
  }
  setBusy(false);
  if (res.ok) {
    const wrap = bubble(res.answer || "(пустой ответ)");
    provenance(wrap, res.provenance || {});
    costRow(wrap, res.cost || {});
  } else if (res.cancelled) {
    bubble("Ответ отменён.", "error");
  } else {
    bubble(res.error || "Не удалось получить ответ", "error");
  }
  refreshBrains();
});

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit(); }
});
$("input").addEventListener("input", () => {
  $("input").style.height = "auto";
  $("input").style.height = Math.min($("input").scrollHeight, 144) + "px";
});
$("cancel").addEventListener("click", () => api("/api/cancel", {}));

/* ---------- side panels ---------- */

document.querySelectorAll(".tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === btn));
    document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + btn.dataset.pane));
  });
});

function brainNote(b) {
  if (b.ready) return "";
  if (!b.enabled) return b.setup_hint || "выключен";
  if (!b.key_present) return b.setup_hint || "нет ключа";
  if (b.cooldown_for > 0) return "кулдаун " + Math.round(b.cooldown_for) + "с";
  if (b.rpd && b.day_count >= b.rpd) return "дневной лимит исчерпан";
  if (!b.usable) return "недоступен";
  return "лимит в минуту";
}

async function refreshBrains() {
  let s;
  try { s = await api("/api/brains"); } catch (e) { return; }
  const host = $("brains");
  host.innerHTML = "";
  $("brainsline").textContent = (s.available || []).length + "/" + (s.brains || []).length + " мозгов · " + (s.policy || "");
  (s.brains || []).forEach(b => {
    const el = document.createElement("div");
    el.className = "brain" + (b.ready ? " ready" : "");
    const top = document.createElement("div");
    top.className = "brain-top";
    const id = document.createElement("span"); id.className = "brain-id"; id.textContent = b.brain_id;
    const st = document.createElement("span"); st.className = "state";
    st.textContent = b.ready ? (b.calls ? b.ewma_latency.toFixed(2) + "с" : "готов") : "—";
    top.append(id, st);
    const model = document.createElement("div");
    model.className = "brain-model"; model.textContent = b.model + " · " + b.tier;
    el.append(top, model);
    const note = brainNote(b);
    if (note) {
      const n = document.createElement("div"); n.className = "brain-note"; n.textContent = note;
      el.appendChild(n);
    }
    /* A key field appears only where one is actually missing -- the whole
       reason env-var-only configuration is wrong for a desktop app. */
    if (!b.key_present && b.api_key_env) {
      const row = document.createElement("div");
      row.className = "keyrow";
      const input = document.createElement("input");
      input.type = "password"; input.placeholder = b.api_key_env;
      const save = document.createElement("button");
      save.textContent = "Сохранить";
      save.addEventListener("click", async () => {
        if (!input.value.trim()) return;
        save.disabled = true;
        const r = await api("/api/key", { env: b.api_key_env, value: input.value.trim() });
        save.textContent = r.ok ? "Сохранено" : "Ошибка";
        input.value = "";
      });
      row.append(input, save);
      el.appendChild(row);
    }
    host.appendChild(el);
  });
}

async function refreshSystem() {
  try {
    const p = await api("/api/paths");
    const dl = $("paths");
    dl.innerHTML = "";
    const rows = [
      ["данные", p.data_root],
      ["код агента", p.package_root],
      ["песочница", p.sandbox_python],
      ["самопатчинг", p.self_patching_possible ? "доступен" : "недоступен"],
      ["упаковано", p.frozen ? "да" : "нет (исходники)"],
    ];
    rows.forEach(([k, v]) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      if (k === "самопатчинг") dd.className = p.self_patching_possible ? "yes" : "no";
      dl.append(dt, dd);
    });
    const e = await api("/api/evolution");
    $("evo").textContent = e.running
      ? "Эволюция идёт: цикл " + e.cycle + " из " + (e.target_cycle || "?")
      : "Эволюция не запущена. Цикл " + (e.cycle ?? 0) + ".";
  } catch (err) { /* panel is informational */ }
}

/* ---------- live log ---------- */

const stream = new EventSource("/api/events");
stream.onmessage = (e) => {
  let ev;
  try { ev = JSON.parse(e.data); } catch (_) { return; }
  const line = document.createElement("span");
  line.className = ev.kind;
  line.textContent = ev.text + "\n";
  const box = $("logstream");
  box.appendChild(line);
  while (box.childElementCount > 400) box.removeChild(box.firstChild);
  box.parentElement.scrollTop = box.parentElement.scrollHeight;
  if (ev.kind === "banner") { refreshBrains(); refreshSystem(); }
};

async function pollState() {
  try {
    const s = await api("/api/state");
    if (s.error) {
      $("dot").className = "dot error";
      $("state").textContent = "Ошибка запуска";
    } else if (s.ready && !busy) {
      $("dot").className = "dot ready";
      $("state").textContent = "Готова";
    }
  } catch (e) { /* server still starting */ }
}

pollState();
refreshBrains();
refreshSystem();
setInterval(pollState, 2000);
setInterval(refreshSystem, 5000);

/* ---------- cognitive cycle ---------- */

function sliceRow(parent, s) {
  const row = document.createElement("div");
  row.className = "slice";
  const name = document.createElement("span");
  name.textContent = s.slice;
  const score = document.createElement("span");
  score.textContent = s.score.toFixed(2);
  const bar = document.createElement("div");
  bar.className = "bar";
  /* The INTERVAL, not just the score: a 1.00 from four observations and a
     1.00 from forty are different claims, and a bare number hides that. */
  const fill = document.createElement("i");
  fill.style.left = (s.low * 100) + "%";
  fill.style.width = Math.max(1, (s.high - s.low) * 100) + "%";
  const mark = document.createElement("u");
  mark.style.left = (s.score * 100) + "%";
  bar.appendChild(fill); bar.appendChild(mark);
  bar.title = "n=" + s.observations + ", интервал " +
              s.low.toFixed(2) + "–" + s.high.toFixed(2);
  row.appendChild(name); row.appendChild(score); row.appendChild(bar);
  parent.appendChild(row);
}

function renderCycle(state) {
  const out = $("cycle-out");
  const running = !!state.running;
  $("cycle-start").disabled = running;
  $("cycle-stop").disabled = !running;
  if (running) { $("cycle-note").textContent = "Цикл идёт. Шаги — в Журнале."; return; }
  if (state.note) { $("cycle-note").textContent = state.note; return; }
  const r = state.report;
  if (!r) return;
  $("cycle-note").textContent = "Остановка: " + r.stop_reason;
  out.textContent = "";
  const kv = document.createElement("div");
  kv.className = "kv";
  const put = (k, v) => {
    const b = document.createElement("b"); b.textContent = k;
    const s = document.createElement("span"); s.textContent = v;
    kv.appendChild(b); kv.appendChild(s);
  };
  put("шагов", r.steps);
  put("снято неопределённости", r.total_resolution);
  const c = r.cost || {};
  if (c.calls) {
    const mix = Object.entries(c.by_substrate || {}).map(([k, v]) => k + "×" + v).join(", ");
    put("стоило", c.calls + " вызовов, " + (c.wall_seconds || 0).toFixed(1) + " с, " +
        (c.tokens_in + c.tokens_out) + " токенов");
    if (mix) put("субстраты", mix);
  }
  if ((r.adopted_capabilities || []).length) put("принято", r.adopted_capabilities.join(", "));
  out.appendChild(kv);
  (r.profile || []).forEach(s => sliceRow(out, s));
}

async function refreshCycle() {
  try { renderCycle(await api("/api/cycle")); } catch (e) {}
}

$("cycle-start").addEventListener("click", async () => {
  $("cycle-out").textContent = "";
  $("cycle-note").textContent = "Запускаю…";
  const res = await api("/api/cycle/start", {
    budget: Number($("cycle-budget").value) || 200,
    steps: Number($("cycle-steps").value) || 6,
  });
  if (!res.ok) $("cycle-note").textContent = res.error || "не удалось запустить";
  refreshCycle();
});

$("cycle-stop").addEventListener("click", async () => {
  const res = await api("/api/cycle/stop", {});
  $("cycle-note").textContent = res.note || res.error || "";
});

/* ---------- genome ---------- */

async function refreshGenome() {
  const out = $("genome-out");
  let g;
  try { g = await api("/api/genome"); } catch (e) { return; }
  out.textContent = "";
  out.className = "";
  const kv = document.createElement("div");
  kv.className = "kv";
  const put = (k, v) => {
    const b = document.createElement("b"); b.textContent = k;
    const s = document.createElement("span"); s.textContent = v;
    kv.appendChild(b); kv.appendChild(s);
  };
  put("файл", g.path);
  put("состояние", g.note);
  if (g.present) {
    put("геном", g.genome_id + (g.parent_id ? " ← " + g.parent_id : ""));
    if (g.mutation) put("мутация", g.mutation);
    Object.entries(g.size || {}).forEach(([k, v]) => put(k, v));
  }
  out.appendChild(kv);
  (g.brains || []).forEach(b => {
    const row = document.createElement("div");
    row.className = "prov";
    tag(row, b.brain_id, "good");
    tag(row, b.substrate);
    tag(row, "доказан на: " + (b.applicability.join(", ") || "—"));
    out.appendChild(row);
  });
}

setInterval(() => {
  if (document.querySelector('[data-pane="cycle"]').classList.contains("on")) refreshCycle();
}, 2000);
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.pane === "cycle") refreshCycle();
  if (b.dataset.pane === "genome") refreshGenome();
}));
</script>
